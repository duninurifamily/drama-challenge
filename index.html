<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>닥터신 챌린지</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:0 0 60px}
.scr{display:none;padding:1.25rem 1rem 2.5rem}
.scr.on{display:block}
h2{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
.sub{font-size:13px;color:#888;margin-bottom:1.25rem}
.card{background:#fff;border:0.5px solid #e5e5e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
label{font-size:13px;color:#888;display:block;margin-bottom:5px}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid #e0e0db;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;outline:none;margin-bottom:4px;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:#1a1a1a}
textarea{height:68px;resize:none}
.field-wrap{margin-bottom:10px}
.field-msg{font-size:12px;margin:3px 0 0;min-height:16px;display:block;color:#e24b4a}
.field-msg.ok{color:#1d9e75}
.input-ok{border-color:#1d9e75!important}
.input-err{border-color:#e24b4a!important}
.btn{width:100%;padding:11px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;border:1px solid #e0e0db;background:#fff;color:#1a1a1a;margin-top:4px;transition:background .15s}
.btn:hover{background:#f5f5f0}
.btn-p{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-p:hover{opacity:.85}
.btn-sm{width:auto;padding:6px 14px;font-size:13px;margin-top:0}
.btn-ghost{width:auto;padding:0;font-size:13px;background:none;border:none;color:#888;cursor:pointer}
.back{font-size:13px;color:#888;cursor:pointer;margin-bottom:1rem;display:inline-flex;align-items:center;gap:4px;background:none;border:none;padding:0}
.tabs{display:flex;margin-bottom:1.5rem;border-bottom:1px solid #e5e5e0}
.tab{flex:1;padding:9px 0;font-size:13px;font-weight:600;color:#888;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:#1a1a1a;border-bottom-color:#1a1a1a}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px;margin-bottom:1.5rem}
.ep-btn{padding:7px 4px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid #e0e0db;background:#fff;color:#888;cursor:pointer;text-align:center;transition:all .15s}
.ep-btn.done{background:#1d9e75;border-color:#0f6e56;color:#fff}
.ep-btn:hover:not(.done){background:#f5f5f0}
.pbar-bg{height:5px;border-radius:3px;background:#f0f0eb;overflow:hidden;margin-bottom:3px}
.pbar{height:100%;border-radius:3px;transition:width .4s}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px}
.b-scene{background:#eeedfe;color:#3c3489}
.b-line{background:#faeeda;color:#633806}
.b-review{background:#e1f5ee;color:#085041}
.room-item{padding:10px 12px;border:1px solid #e0e0db;border-radius:8px;cursor:pointer;margin-bottom:8px;transition:all .15s;background:#fff}
.room-item:hover,.room-item.sel{border-color:#1a1a1a;background:#f9f9f6}
.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);align-items:flex-start;justify-content:center;z-index:100;padding-top:60px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.25rem;width:92%;max-width:380px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:3px}
.modal-sub{font-size:13px;color:#888;margin-bottom:1rem}
.type-btns{display:flex;gap:6px;margin-bottom:10px}
.type-btn{flex:1;padding:6px 4px;font-size:12px;border-radius:8px;border:1px solid #e0e0db;background:#fff;color:#888;cursor:pointer;text-align:center}
.type-btn.on{border-color:#1a1a1a;color:#1a1a1a;font-weight:600}
.img-upload-area{border:1px dashed #ccc;border-radius:8px;padding:1rem;text-align:center;cursor:pointer;margin-bottom:10px;font-size:13px;color:#888}
.img-preview{width:100%;border-radius:8px;margin-bottom:8px;display:none;max-height:240px;object-fit:cover}
.feed-card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;margin-bottom:14px;overflow:hidden}
.feed-img{width:100%;display:block;max-height:320px;object-fit:cover}
.feed-body{padding:.875rem 1rem}
.feed-meta{font-size:12px;color:#888;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.feed-meta-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.feed-edit-btns{display:flex;gap:10px}
.feed-edit-btn{font-size:11px;color:#bbb;cursor:pointer;background:none;border:none;padding:0;transition:color .15s}
.feed-edit-btn:hover{color:#888}
.feed-edit-btn.del:hover{color:#e24b4a}
.feed-text{font-size:15px;color:#1a1a1a;line-height:1.6;margin-bottom:.75rem}
.feed-edit-box{display:none;margin-bottom:.75rem}
.feed-edit-box.on{display:block}
.feed-edit-box textarea{margin-bottom:6px;height:72px}
.feed-edit-box-btns{display:flex;gap:6px;justify-content:flex-end}
.comment-area{border-top:1px solid #f0f0eb;padding-top:.75rem}
.comment-item{font-size:13px;color:#1a1a1a;padding:5px 0;border-bottom:1px solid #f0f0eb}
.comment-item:last-child{border-bottom:none}
.comment-meta{font-size:11px;color:#888;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.comment-edit-btns{display:flex;gap:8px}
.comment-edit-btn{font-size:10px;color:#bbb;cursor:pointer;background:none;border:none;padding:0}
.comment-edit-btn:hover{color:#888}
.comment-edit-btn.del:hover{color:#e24b4a}
.reply-item{margin-left:16px;border-left:2px solid #e5e5e0;padding-left:10px;margin-top:4px}
.comment-edit-box{display:none;margin-top:6px}
.comment-edit-box.on{display:block}
.comment-edit-box input{margin-bottom:6px}
.comment-input-row{display:flex;gap:6px;margin-top:8px;align-items:center}
.comment-input-row input{margin-bottom:0;flex:1;font-size:13px}
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #e5e5e0;margin-bottom:8px}
.rank-item.me{border-color:#1a1a1a;background:#f9f9f6}
.rank-num{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rank-pct{font-size:14px;font-weight:700;color:#1a1a1a;flex-shrink:0;width:36px;text-align:right}
.me-tag{font-size:10px;color:#888;font-weight:400}
.owner-tag{font-size:10px;padding:1px 6px;background:#eeedfe;color:#3c3489;border-radius:4px;font-weight:400}
.dynamic-msg{font-size:13px;color:#888;line-height:1.6;margin-bottom:1.25rem;padding:12px 14px;background:#f9f9f6;border-radius:8px;border-left:3px solid #e0e0db}
.notice-bar{background:#faeeda;border-radius:8px;padding:10px 12px;margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:8px}
.notice-content{flex:1;font-size:13px;color:#633806;line-height:1.5}
.notice-actions{display:flex;gap:8px;flex-shrink:0;margin-top:1px}
.notice-btn{font-size:11px;color:#ba7517;cursor:pointer;background:none;border:none;padding:0}
.notice-input-area{background:#faeeda;border-radius:8px;padding:10px 12px;margin-bottom:1.25rem;display:none}
.notice-input-area.on{display:block}
.notice-input-area textarea{background:#fff8ee;border-color:#e8c87a;height:60px;margin-bottom:8px;font-size:13px}
.notice-input-btns{display:flex;gap:6px;justify-content:flex-end}
.hero-wrap{position:relative;margin-bottom:1.25rem}
.hero-img-el{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:none}
.hero-ph{border:1px dashed #ccc;border-radius:12px;padding:1.5rem;text-align:center;font-size:13px;color:#aaa}
.hero-change-btn{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;display:none}
.owner-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:6px;background:#eeedfe;color:#3c3489;margin-left:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;display:none;white-space:nowrap}
.loading{text-align:center;padding:2rem;font-size:13px;color:#888}
.challenge-type-wrap{border:1px solid #e0e0db;border-radius:8px;padding:10px 12px;margin-bottom:10px}
.challenge-opt{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:13px;color:#1a1a1a}
.challenge-opt input[type=radio]{width:14px;height:14px;flex-shrink:0;accent-color:#1a1a1a}
.challenge-opt-sub{font-size:11px;color:#888;padding-left:22px;margin-top:-3px;margin-bottom:6px}
.challenge-opt.disabled{opacity:.4;cursor:not-allowed}
.ep-count-wrap{background:#f5f5f0;border-radius:6px;padding:8px 10px;margin-top:8px}
.ep-count-wrap label{font-size:12px;color:#888;margin-bottom:4px}
.ep-count-wrap select{margin-bottom:0;font-size:13px}
.ep-section-label{font-size:13px;color:#888;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">

<div id="s-home" class="scr on" style="padding-top:2rem">
  <div class="hero-wrap">
    <img id="hero-img-home" class="hero-img-el" alt="대표 이미지"/>
    <div id="hero-ph-home" class="hero-ph"><div style="font-size:28px;margin-bottom:6px">🏥</div>닥터신 챌린지</div>
  </div>
  <h2 style="font-size:22px;margin-bottom:4px">닥터신 챌린지</h2>
  <p class="sub" style="margin-bottom:1.5rem">임성한 작가의 병맛 드라마, 같이 버텨보자</p>
  <button class="btn btn-p" style="margin-bottom:10px" onclick="go('s-create')">방 만들기</button>
  <button class="btn" onclick="goJoin()">기존 방 입장하기</button>
</div>

<div id="s-create" class="scr">
  <button class="back" onclick="go('s-home')">← 돌아가기</button>
  <h2>방 만들기</h2><p class="sub">새 챌린지 방을 개설해</p>
  <div class="card">
    <div class="field-wrap">
      <label>방 이름</label>
      <input type="text" id="c-rname" placeholder="예: 병맛클럽" oninput="checkRoomName(this.value)"/>
      <span id="c-rname-msg" class="field-msg"></span>
    </div>
    <div class="field-wrap">
      <label>내 닉네임 <span style="font-size:11px;color:#aaa">(방장으로 저장)</span></label>
      <input type="text" id="c-nick" placeholder="예: 듀리"/>
    </div>
    <div class="field-wrap">
      <label>방 비밀번호 <span style="font-size:11px;color:#aaa">(친구에게 공유)</span></label>
      <input type="password" id="c-pw" placeholder="예: 1234"/>
    </div>
    <div class="field-wrap">
      <label style="font-weight:600;color:#1a1a1a;margin-bottom:8px">챌린지 종류</label>
      <div class="challenge-type-wrap">
        <label class="challenge-opt">
          <input type="radio" name="ctype" value="drama" checked onchange="onChallengeType()"/> 드라마 챌린지
        </label>
        <div class="challenge-opt-sub">시청 완료 + 기록 + 대결</div>
        <label class="challenge-opt disabled">
          <input type="radio" name="ctype" disabled/> <span style="color:#aaa">더 많은 종류 준비 중...</span>
        </label>
        <div class="ep-count-wrap" id="ep-count-wrap">
          <label>총 회차 수</label>
          <select id="c-total" onchange="onTotalChange(this.value)">
            <option value="16">16화</option>
            <option value="20">20화</option>
            <option value="32">32화</option>
            <option value="50">50화</option>
            <option value="100">100화</option>
            <option value="custom">직접 입력</option>
          </select>
          <div id="custom-ep-wrap" style="display:none;margin-top:6px">
            <input type="number" id="c-custom-total" placeholder="회차 수 입력" min="1" max="500" style="margin-bottom:0"/>
          </div>
        </div>
      </div>
    </div>
    <span id="c-global-err" class="field-msg" style="display:block;margin-bottom:6px"></span>
    <button class="btn btn-p" onclick="createRoom()">방 만들기</button>
  </div>
</div>

<div id="s-join" class="scr">
  <button class="back" onclick="go('s-home')">← 돌아가기</button>
  <h2>방 입장하기</h2><p class="sub">입장할 방을 선택해</p>
  <div id="room-list" style="margin-bottom:12px"></div>
  <div id="no-rooms" style="text-align:center;color:#aaa;font-size:13px;padding:2rem 0;display:none">아직 만들어진 방이 없어.<br/>먼저 방을 만들어봐!</div>
  <div id="j-form" style="display:none">
    <div class="card">
      <p style="font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:10px" id="j-room-label"></p>
      <div class="field-wrap">
        <label>내 닉네임</label>
        <input type="text" id="j-nick" placeholder="닉네임 입력" oninput="checkJoinNick(this.value)"/>
        <span id="j-nick-msg" class="field-msg"></span>
      </div>
      <div class="field-wrap">
        <label>방 비밀번호</label>
        <input type="password" id="j-pw" placeholder="비밀번호 입력"/>
      </div>
      <span id="j-global-err" class="field-msg" style="display:block;margin-bottom:6px"></span>
      <button class="btn btn-p" onclick="joinRoom()">입장</button>
    </div>
  </div>
</div>

<div id="s-main" class="scr" style="padding-bottom:80px">
  <div class="hero-wrap">
    <img id="hero-img-main" class="hero-img-el" alt="대표 이미지"/>
    <div id="hero-ph-main" class="hero-ph" style="padding:1rem;font-size:12px">대표 이미지 없음</div>
    <button class="hero-change-btn" id="hero-change-btn" onclick="document.getElementById('hero-file-main').click()">📷 이미지 변경</button>
    <input type="file" id="hero-file-main" accept="image/*" style="display:none" onchange="uploadHero(this)"/>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
    <div style="display:flex;align-items:center;gap:4px">
      <h2 id="m-title"></h2>
      <span id="owner-badge" class="owner-badge" style="display:none">👑 방장</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn-ghost" id="delete-room-btn" onclick="deleteRoom()" style="display:none;color:#e24b4a;font-size:12px">🗑 방 삭제</button>
      <button class="btn-ghost" onclick="leaveRoom()">나가기</button>
    </div>
  </div>
  <p class="sub" id="m-sub"></p>

  <div id="notice-section"></div>

  <div class="tabs">
    <button class="tab on" onclick="switchTab(0)">진행 · 대결</button>
    <button class="tab" onclick="switchTab(1)">피드</button>
  </div>
  <div id="tab-0">
    <div id="dynamic-msg" class="dynamic-msg" style="display:none"></div>
    <div id="ranking-list" style="margin-bottom:1.25rem"></div>
    <p class="ep-section-label">내 진행 현황 — 회차 클릭해서 완료 처리</p>
    <div class="ep-grid" id="ep-grid"></div>
  </div>
  <div id="tab-1" style="display:none"><div id="feed-list"></div></div>
</div>

</div>

<div id="modal-ep" class="modal-bg">
  <div class="modal">
    <h3 id="mod-title"></h3>
    <p class="modal-sub">기록을 남겨봐 (선택)</p>
    <div class="type-btns">
      <button class="type-btn on" id="tb-review" onclick="selType('review')">💬 한줄 감상</button>
      <button class="type-btn" id="tb-scene" onclick="selType('scene')">🎬 명장면</button>
      <button class="type-btn" id="tb-line" onclick="selType('line')">💬 명대사</button>
    </div>
    <div class="img-upload-area" id="img-upload-label" onclick="document.getElementById('ep-img-file').click()">📷 이미지 첨부 (선택)</div>
    <input type="file" id="ep-img-file" accept="image/*" style="display:none" onchange="previewEpImg(this)"/>
    <img id="ep-img-preview" class="img-preview" alt="미리보기"/>
    <textarea id="mod-text" placeholder="이 회차의 기억에 남는 순간은?"></textarea>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="closeModal()">취소</button>
      <button class="btn btn-sm btn-p" style="flex:1" onclick="saveEp()">완료 저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwjGgQ2naJOonhpcTYR2jH-qwXqw5DMjE",
  authDomain: "drama-challenge-v1.firebaseapp.com",
  projectId: "drama-challenge-v1",
  storageBucket: "drama-challenge-v1.firebasestorage.app",
  messagingSenderId: "785808529649",
  appId: "1:785808529649:web:524e1e686def20cb26b150"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let cur = { roomId: null, user: null };
let selEp = null, selTyp = 'review', epImgData = null, selRoomId = null;
let unsubFeed = null, unsubRoom = null;
let currentTotal = 16;

// ─── 임성한 다이나믹 멘트 ───
function getImSungHanMsg(myRank, totalMembers, myDone, topDone, total, topName) {
  const diff = topDone - myDone;
  const myPct = Math.round(myDone / total * 100);

  // 완주
  if (myDone >= total) return `말 있지, 칼 뽑았으면 무라도 썰으라구. 근데 나는 칼도 썰구 밥도 다 먹었어. 이 챌린지, 내가 완주했구. 그쪽들 아직 멀었지? 기막히구 코막혀.`;

  // 0화 시작도 안 함
  if (myDone === 0) return `아서. 말 있지? 시작두 안 했으면서 뭘 바래? 벌떡 일어나 뛰려 애라도 쓰는 게 만물 영장이구 인간이야. 나자빠져있는 건 인간 거죽 쓴 금수라구.`;

  // 1등
  if (myRank === 1) {
    if (diff === 0 && totalMembers > 1) return `말 있지, 동률이라구. 이건 예사로운 일이 아니야. 운명이 우릴 같은 선상에 올려놓은 거구. 근데 순리는 결국 하나야. 내가 먼저 치고 나가는 거라구.`;
    if (totalMembers === 1) return `말 있지, 혼자 달리는 거 멋있긴 한데. 같이 달릴 사람 불러오는 게 도리구 순리야. 그쪽, 친구 없어? 기막히구 코막혀.`;
    return `말 있지, 오를 때가 있으면 내려올 때두 있는 거라구. 근데 지금은 내가 1등이구. ${topName}이랑 비교하는 거 자체가 웃기지 않아? 묵묵히 앞만 보는 게 이치구 도리야.`;
  }

  // 꼴등
  if (myRank === totalMembers && totalMembers > 1) {
    if (diff >= 8) return `기막히구 코막혀. ${topName}이 ${diff}화나 앞에 있다구? 이게 말이 돼? 말 있지, 사람 나이 들어서 힘 없으면 볼썽 사나워. 칼 뽑았으면 무라도 썰으라구. 이판사판 공사판이야.`;
    return `말 있지, 꼴등이라구 포기해? 미쳤다구 지금? 사람이면 응당 나자빠질 수 있어. 근데 계속 나자빠져있는 건 인간 거죽 쓴 금수야. 벌떡 일어나!`;
  }

  // 중간 순위, 많이 뒤처짐
  if (diff >= 6) return `말 있지, ${topName}이랑 ${diff}화 차이라구. 백짓장두 맞들면 낫다는데 혼자 이러구 있어? 마더테레사 납셨어. 아서, 지금 당장 TV 켜라구.`;

  // 중간 순위, 박빙
  if (diff <= 2 && diff > 0) return `말 있지, ${topName}이랑 ${diff}화 차이라구. 칼 한 번만 더 뽑으면 돼. 이거 놓치면 평생 후회라구. 그쪽, 안 질리구 배겨? 순리에 따라가라구.`;

  // 일반 중간
  return `말 있지, 과거는 히스토리구 미래는 미스테리구 현재는 프레젠트, 선물이라구. 지금 ${myPct}%야. 히스토리 자꾸 들춰 뭐해? 지금 이 순간 달리는 게 이치구 도리야.`;
}

// ─── 히어로 이미지 ───
function resizeImage(file, maxWidth, quality, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', quality));
    }; img.src = e.target.result;
  }; reader.readAsDataURL(file);
}
async function uploadHero(inp) {
  const roomDoc = await getDoc(doc(db, 'rooms', cur.roomId));
  if (!roomDoc.exists() || roomDoc.data().owner !== cur.user) return;

  showToast('이미지 업로드 중...');
  resizeImage(f, 800, 0.7, async base64 => {
    await updateDoc(doc(db, 'rooms', cur.roomId), { heroImg: base64 });

  const total = rm.total || 16;
  const ranked = members.map(n => ({
    name: n, done: (rm.members[n]?.done || []).length,
    pct: Math.round((rm.members[n]?.done || []).length / total * 100)
  })).sort((a, b) => b.done - a.done);

  const medals = ['🥇', '🥈', '🥉'];
  const colors = ['#1d9e75', '#378add', '#d4537e', '#f5a623', '#888'];
  const rankEl = document.getElementById('ranking-list');
  rankEl.innerHTML = ranked.map((m, i) => {
    const isMe = m.name === cur.user;
    return `<div class="rank-item${isMe ? ' me' : ''}">
      <div class="rank-num">${i < 3 ? medals[i] : `<span style="font-size:13px;color:#888">${i+1}</span>`}</div>
      <div class="rank-info">
        <div class="rank-name">
          ${m.name}
          ${isMe ? '<span class="me-tag">(나)</span>' : ''}
          ${m.name === rm.owner ? '<span class="owner-tag">방장</span>' : ''}
        </div>
        <div class="pbar-bg"><div class="pbar" style="width:${m.pct}%;background:${colors[Math.min(i, colors.length-1)]}"></div></div>
      </div>
      <div class="rank-pct">${m.pct}%</div>
    </div>`;
  }).join('');

  // 다이나믹 멘트
  const myIdx = ranked.findIndex(m => m.name === cur.user);
  const myData = ranked[myIdx];
  const topData = ranked[0];
  const msgEl = document.getElementById('dynamic-msg');
  if (myData) {
    const msg = getImSungHanMsg(myIdx + 1, ranked.length, myData.done, topData.done, total, topData.name);
    msgEl.textContent = msg; msgEl.style.display = 'block';
  }
}

          <div class="feed-meta">
            <div class="feed-meta-left">
              <span class="badge ${t.cls}">${t.label}</span>
              <span>${f.user}</span><span>·</span><span>${f.ep}화</span><span>·</span><span>${ds}</span>
            </div>
            ${isMyPost ? `<div class="feed-edit-btns">
              <button class="feed-edit-btn" onclick="toggleFeedEdit('${fid}')">수정</button>
              <button class="feed-edit-btn del" onclick="deleteFeed('${fid}')">삭제</button>
            </div>` : ''}
          </div>
          ${f.text ? `<div class="feed-text" id="ft-${fid}">${f.text}</div>` : ''}
          ${isMyPost && f.text ? `<div class="feed-edit-box" id="feb-${fid}">
            <textarea id="fei-${fid}">${f.text}</textarea>
            <div class="feed-edit-box-btns">
              <button class="btn btn-sm" onclick="toggleFeedEdit('${fid}')">취소</button>
              <button class="btn btn-sm btn-p" onclick="saveFeedEdit('${fid}')">저장</button>
            </div>
          </div>` : ''}
          <div class="comment-area">${commHtml}
            <div class="comment-input-row" style="margin-top:${comments.length?'8px':'0'}">
              <input type="text" placeholder="댓글 달기..." id="ct-${fid}"/>
              <button class="btn btn-sm" onclick="addComment('${fid}')">등록</button>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  });
}

// ─── 피드 수정/삭제 ───
function toggleFeedEdit(fid) {
  const box = document.getElementById('feb-' + fid); if (!box) return;
  box.classList.toggle('on');
}
window.toggleFeedEdit = toggleFeedEdit;

async function saveFeedEdit(fid) {
  const text = document.getElementById('fei-' + fid)?.value.trim(); if (!text) return;
  await updateDoc(doc(db, 'rooms', cur.roomId, 'feed', fid), { text });
  showToast('수정됐어');
}
window.saveFeedEdit = saveFeedEdit;

async function deleteFeed(fid) {
  if (!confirm('이 기록을 삭제할까?')) return;
  await deleteDoc(doc(db, 'rooms', cur.roomId, 'feed', fid));
  showToast('삭제됐어');
}
window.deleteFeed = deleteFeed;

// ─── 댓글 수정/삭제 ───
function toggleCommentEdit(fid, ci) {
  document.getElementById(`ceb-${fid}-${ci}`)?.classList.toggle('on');
}
window.toggleCommentEdit = toggleCommentEdit;

async function saveCommentEdit(fid, ci) {
  const text = document.getElementById(`cei-${fid}-${ci}`)?.value.trim(); if (!text) return;
  const feedRef = doc(db, 'rooms', cur.roomId, 'feed', fid);
  const feedDoc = await getDoc(feedRef);
  const comments = feedDoc.data().comments || [];
  comments[ci].text = text;
  await updateDoc(feedRef, { comments });
  showToast('댓글이 수정됐어');
}
window.saveCommentEdit = saveCommentEdit;

async function deleteComment(fid, ci) {
  if (!confirm('댓글을 삭제할까?')) return;
  const feedRef = doc(db, 'rooms', cur.roomId, 'feed', fid);
  const feedDoc = await getDoc(feedRef);
  const comments = feedDoc.data().comments || [];
  comments.splice(ci, 1);
  await updateDoc(feedRef, { comments });
  showToast('댓글이 삭제됐어');
}
window.deleteComment = deleteComment;

// ─── 댓글/답글 ───
function toggleReply(fid, ci) { const el = document.getElementById(`ri-${fid}-${ci}`); el.style.display = el.style.display==='none'?'block':'none'; }
window.toggleReply = toggleReply;

async function addComment(fid) {
  const inp = document.getElementById('ct-' + fid); const text = inp.value.trim(); if (!text) return;
  const d = new Date(); const ts = (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  const feedRef = doc(db, 'rooms', cur.roomId, 'feed', fid);
  const feedDoc = await getDoc(feedRef);
  const comments = feedDoc.data().comments || [];
  comments.push({ user: cur.user, text, ts, replies: [] });
  await updateDoc(feedRef, { comments }); inp.value = '';
}
window.addComment = addComment;

async function addReply(fid, ci) {
  const inp = document.getElementById(`rt-${fid}-${ci}`); const text = inp.value.trim(); if (!text) return;
  const d = new Date(); const ts = (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  const feedRef = doc(db, 'rooms', cur.roomId, 'feed', fid);
  const feedDoc = await getDoc(feedRef);
  const comments = feedDoc.data().comments || [];
  comments[ci].replies = comments[ci].replies || [];
  comments[ci].replies.push({ user: cur.user, text, ts });
  await updateDoc(feedRef, { comments });
}
window.addReply = addReply;

// ─── 세션 복원 ───
const saved = localStorage.getItem('ds-session');
if (saved) { try { cur = JSON.parse(saved); enterRoom(); } catch(e) { localStorage.removeItem('ds-session'); } }
</script>
